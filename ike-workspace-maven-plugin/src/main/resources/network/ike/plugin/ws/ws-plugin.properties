# Resolved at build time by Maven resource filtering.
# ws:scaffold-init uses these to generate workspace POMs with the correct
# tooling version — derived from ike-parent, not guessed.
# The RIGHT-side values use canonical typed-marker form (the parent pom's
# source declarations); the LEFT-side keys remain short-name because
# they're the public API the plugin's runtime consumers read.
ike-tooling.version=${network.ike.tooling__GA__ike-tooling__VERSION}
ike-docs.version=${network.ike.docs__GA__ike-docs__VERSION}
ike-platform.version=${project.version}
ike-workspace-extension.version=${network.ike.tooling__GA__ike-workspace-extension__VERSION}
