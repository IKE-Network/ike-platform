# release-cascade.yaml — ike-platform's edges in the IKE release
# cascade (IKE-Network/ike-issues#420).
#
# The cascade is a loosely-coupled distributed system: every
# foundation repo version-controls this file in its own git tree and
# declares ONLY its own edges. No project authors the global ordering
# — the full graph (ike-tooling → ike-docs → ike-platform) is
# assembled by traversing these per-project files.
#
#   upstream   — projects this repo consumes; each names the
#                ${X.version} property the cascade aligns to the
#                upstream's latest release before a release here.
#   downstream — foundation projects that consume this repo.
#   terminal   — asserted positively: ike-platform has no downstream
#                edge, so the cascade stops here. A forgotten
#                downstream edge would be a manifest error, not a
#                silent omission.

schema: 1
terminal: true

upstream:
  - groupId: network.ike.tooling
    artifactId: ike-tooling
    version-property: ike-tooling.version
    url: https://github.com/IKE-Network/ike-tooling.git
  - groupId: network.ike.docs
    artifactId: ike-docs
    version-property: ike-docs.version
    url: https://github.com/IKE-Network/ike-docs.git
